[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "protondb-cli"
version = "0.1.0"
description = "Check a game's Linux compatibility (ProtonDB) from the terminal."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kernel Kraken crew" }]
keywords = ["linux", "proton", "gaming", "protondb", "steam", "cli"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
]

[project.scripts]
proton = "protondb_cli.cli:main"

[tool.setuptools]
packages = ["protondb_cli"]
