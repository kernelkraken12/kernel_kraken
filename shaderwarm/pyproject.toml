[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "shaderwarm"
version = "0.1.0"
description = "Warm shaders, smooth FPS — scan, warm up and keep Steam's shader caches on Linux."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "The Kernel Kraken (kernelkraken12)" }]
keywords = ["shader", "dxvk", "vkd3d", "proton", "linux", "gaming", "steam", "cli"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
    "Topic :: Utilities",
]

# No runtime dependencies — stdlib only (ground rule #2). Every distro.

[project.scripts]
shaderwarm = "shaderwarm.cli:main"

[tool.setuptools]
packages = ["shaderwarm"]
