[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gamesage"
version = "0.1.0"
description = "Simple game session reports with smart performance tips for Linux gamers."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
gamesage = "gamesage.cli:main"

[tool.setuptools]
packages = ["gamesage"]
