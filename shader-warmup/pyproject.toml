[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shader-warmup"
version = "0.1.0"
description = "Pre-bake DXVK shader caches so games start smooth on Linux"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
shader-warmup = "shader_warmup.cli:main"

[tool.setuptools.packages.find]
include = ["shader_warmup*"]
