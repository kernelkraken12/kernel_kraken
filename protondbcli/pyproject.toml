[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "protondbcli"
version = "0.1.0"
description = "The kernel kraken's game checker — will it run on Linux, and how?"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "The Kernel Kraken (kernelkraken12)" }]
keywords = ["proton", "linux", "gaming", "protondb", "steam", "cli"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
    "Topic :: Utilities",
]

# No runtime dependencies — stdlib only (ground rule #2: real deps only).
# This is what makes it work on EVERY Linux distro with Python 3.9+.

[project.scripts]
proton = "protondbcli.cli:main"

[tool.setuptools]
packages = ["protondbcli"]
